    <g transform="translate(251, 304)"><rect width="140" height="28" rx="14" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1.2"/><text x="70.0" y="18.5" fill="#67e8f9" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MCP &amp; AI Agents</text></g>
